name: Packages

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main

jobs:
  core:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Lint
        run: bun run lint
        working-directory: packages/core

      - name: Typecheck
        run: bun run typecheck
        working-directory: packages/core

      - name: Format check
        run: bun run fmt:check
        working-directory: packages/core

      - name: Test
        run: bun run test
        working-directory: packages/core

  workflows:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Lint
        run: bun run lint
        working-directory: packages/workflows

      - name: Typecheck
        run: bun run typecheck
        working-directory: packages/workflows

      - name: Format check
        run: bun run fmt:check
        working-directory: packages/workflows

      - name: Test
        run: bun run test
        working-directory: packages/workflows
