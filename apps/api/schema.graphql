type Account {
  default: Boolean!
  id: String!
  movements: Boolean!
  name: String!
  sharing: [AccountSharing!]!
  startingBalance: Float
  startingCashBalance: Float
  type: String!
}

type AccountSharing {
  proportion: Float!
  role: String!
  sharedWith: String!
}

type Activity {
  amount: Float!
  category: String
  date: Date!
  description: String
  history: [HistoryEntry!]!
  id: String!
  movements: [ActivityMovement!]!
  name: String!
  project: String
  sharing: [ActivitySharing!]!
  status: String!
  subcategory: String
  transactions: [Transaction!]!
  type: String!
}

type ActivityCategory {
  emoji: String
  id: String!
  name: String!
  type: String!
}

type ActivityMovement {
  amount: Float!
  id: String!
  movement: String!
}

input ActivityMovementInput {
  amount: Float!
  id: String!
  movement: String!
}

type ActivitySharing {
  accounts: [ActivitySharingAccount!]!
  liability: Float!
  user: String!
}

type ActivitySharingAccount {
  account: String!
  amount: Float!
}

type ActivitySubCategory {
  category: String!
  emoji: String
  id: String!
  name: String!
}

type Asset {
  account: String!
  description: String
  id: String!
  location: String
  name: String!
}

type Contact {
  contact: ContactUser!
  createdAt: Date!
  id: String!
}

type ContactUser {
  email: String!
  id: String!
  image: String!
  name: String!
}

type Counterparty {
  account: String!
  contact: String
  description: String
  id: String!
  initialBalance: Float
  name: String!
}

"""
A date string, such as 2007-12-03, compliant with the `full-date` format outlined in section 5.6 of the RFC 3339 profile of the ISO 8601 standard for representation of dates and times using the Gregorian calendar.
"""
scalar Date

type DeleteAccountResponse {
  id: String!
  success: Boolean!
}

type DeleteActivityResponse {
  id: String!
  success: Boolean!
}

type DeleteAssetResponse {
  id: String!
  success: Boolean!
}

type DeleteMovementActivityResponse {
  id: String!
  success: Boolean!
}

type DeleteMovementResponse {
  id: String!
  success: Boolean!
}

type DeleteTransactionResponse {
  id: String!
  success: Boolean!
}

type Event {
  clientId: String!
  createdAt: Float!
  payload: String!
  type: String!
  user: String!
}

type Fund {
  accounts: [FundAccount!]!
  color: String!
  endDate: Date
  id: String!
  name: String!
  parentFund: String
  startDate: Date
}

type FundAccount {
  account: String!
  amount: Float!
  fund: String!
  id: String!
}

input FundAccountInput {
  account: String!
  amount: Float!
  id: String!
}

type FundMove {
  amount: Float!
  date: Date!
  fromFund: String
  id: String!
  note: String
  toFund: String
  transaction: String!
}

input FundMoveInput {
  amount: Float!
  fromFund: String
  id: String!
  note: String
  toFund: String
}

type HistoryEntry {
  action: String!
  changes: String!
  clientId: String!
  createdAt: Float!
  entityId: String!
  entityType: String!
  id: String!
  subject: String
  user: String!
}

type Movement {
  account: String!
  activities: [MovementActivity!]!
  amount: Float!
  date: Date!
  history: [HistoryEntry!]!
  id: String!
  name: String!
  status: String!

  """The unique workflow attached to this movement, if any."""
  workflow: MovementWorkflow
}

type MovementActivity {
  activity: String!
  amount: Float!
  id: String!
}

type MovementWorkflow {
  attempts: Int!
  createdAt: Float!
  error: String
  id: String!
  messages: [WorkflowMessage!]!
  movement: String!
  result: String
  status: String!
  trigger: String!
  updatedAt: Float!
}

type Mutation {
  addTransaction(activityId: String!, amount: Float!, fromAccount: String!, fromAsset: String, fromCounterparty: String, fundMoves: [FundMoveInput!], id: String!, toAccount: String!, toAsset: String, toCounterparty: String): Transaction!

  """Answers the workflow's pending question and resumes the run."""
  answerWorkflow(content: String!, id: String!, optionId: String): MovementWorkflow!
  createAccount(id: String!, movements: Boolean, name: String!, startingBalance: Float, startingCashBalance: Float, type: String!): Account!
  createActivity(category: String, date: Date!, description: String, id: String!, movement: ActivityMovementInput, name: String!, project: String, subcategory: String, transactions: [TransactionInput!], type: String!): Activity!
  createActivityCategory(emoji: String, id: String!, name: String!, type: String!): ActivityCategory!
  createActivitySubCategory(category: String!, emoji: String, id: String!, name: String!): ActivitySubCategory!
  createAsset(account: String!, description: String, id: String!, location: String, name: String!): Asset!
  createContact(contact: String!, id: String!): Contact!
  createCounterparty(account: String!, contact: String, description: String, id: String!, initialBalance: Float, name: String!): Counterparty!
  createFund(color: String, endDate: Date, id: String!, name: String!, parentFund: String, startDate: Date): Fund!
  createMovement(account: String!, amount: Float!, date: Date!, id: String!, name: String!): Movement!
  createMovementActivity(activityId: String!, amount: Float!, id: String!, movementId: String!): MovementActivity!
  createProject(emoji: String, id: String!, name: String!): Project!
  deleteAccount(id: String!): DeleteAccountResponse!
  deleteActivity(id: String!): DeleteActivityResponse!
  deleteActivityCategory(id: String!): DeleteActivityResponse!
  deleteActivitySubCategory(id: String!): DeleteActivityResponse!
  deleteAsset(id: String!): DeleteAssetResponse!
  deleteContact(id: String!): Boolean!
  deleteCounterparty(id: String!): Boolean!
  deleteFund(id: String!): Boolean!
  deleteMovement(id: String!): DeleteMovementResponse!
  deleteMovementActivity(id: String!): DeleteMovementActivityResponse!
  deleteProject(id: String!): Boolean!
  deleteTransaction(activityId: String!, id: String!): DeleteTransactionResponse!
  setFundAccounts(accounts: [FundAccountInput!]!, fund: String!): [FundAccount!]!
  shareAccount(id: String!, userId: String!): Account!
  shareActivity(id: String!, userId: String!): [ActivitySharing!]!

  """
  Runs (or re-runs) the movement's unique workflow. Creates it if missing, resets failed/cancelled workflows, no-op otherwise.
  """
  triggerWorkflow(movementId: String!): MovementWorkflow!
  updateAccount(id: String!, movements: Boolean, name: String, startingBalance: Float, startingCashBalance: Float): Account!
  updateActivity(category: String, date: Date, description: String, id: String!, name: String, project: String, subcategory: String, type: String): Activity!
  updateActivityCategory(emoji: String, id: String!, name: String!): ActivityCategory!
  updateActivitySubCategory(emoji: String, id: String!, name: String!): ActivitySubCategory!
  updateAsset(account: String, description: String, id: String!, location: String, name: String): Asset!
  updateCounterparty(contact: String, description: String, id: String!, initialBalance: Float, name: String): Counterparty!
  updateFund(color: String, endDate: Date, id: String!, name: String, parentFund: String, startDate: Date): Fund!
  updateMovement(account: String, amount: Float, date: Date, id: String!, name: String): Movement!
  updateMovementActivity(amount: Float!, id: String!): MovementActivity!
  updateProject(emoji: String, endDate: Date, id: String!, name: String, startDate: Date): Project!
  updateTransaction(activityId: String!, amount: Float, fromAccount: String, fromAsset: String, fromCounterparty: String, fundMoves: [FundMoveInput!], id: String!, toAccount: String, toAsset: String, toCounterparty: String): Transaction!
}

type Project {
  emoji: String
  endDate: Date
  id: String!
  name: String!
  startDate: Date
}

type Query {
  accounts: [Account!]!
  activities: [Activity!]!
  activityCategories: [ActivityCategory!]!
  activitySubcategories: [ActivitySubCategory!]!
  assets: [Asset!]!
  contacts: [Contact!]!
  counterparties: [Counterparty!]!
  events(lastSync: Float!): [Event!]!
  funds: [Fund!]!
  movements: [Movement!]!
  projects: [Project!]!
  workflows(statuses: [String!]): [MovementWorkflow!]!
}

type Subscription {
  """Events related to posts"""
  events: Event!
}

type Transaction {
  amount: Float!
  fromAccount: String!
  fromAsset: String
  fromCounterparty: String
  fundMoves: [FundMove!]
  id: String!
  toAccount: String!
  toAsset: String
  toCounterparty: String
}

input TransactionInput {
  amount: Float!
  fromAccount: String!
  fromAsset: String
  fromCounterparty: String
  fundMoves: [FundMoveInput!]
  id: String!
  toAccount: String!
  toAsset: String
  toCounterparty: String
}

type WorkflowMessage {
  content: String!
  createdAt: Float!
  id: String!
  optionId: String
  options: [WorkflowMessageOption!]
  role: String!
}

type WorkflowMessageOption {
  id: String!
  label: String!
}